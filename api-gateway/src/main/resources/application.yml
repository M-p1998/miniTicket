server:
  port: 9001

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/miniTicket
          jwk-set-uri: http://keycloak:8080/realms/miniTicket/protocol/openid-connect/certs


  cloud:
    gateway:
      routes:
        - id: ticket-service
          uri: http://miniticket-ticket-service:8080
          predicates:
            - Path=/api/tickets/**

        - id: comment-service
          uri: http://miniticket-comment-service:8081
          predicates:
            - Path=/api/comments/**

        - id: user-service
          uri: http://miniticket-user-service:8083
          predicates:
            - Path=/api/users/**
            
logging:
  level:
    org.springframework.security: DEBUG
