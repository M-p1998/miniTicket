spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8088/realms/miniTicket
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/miniTicket/protocol/openid-connect/certs


