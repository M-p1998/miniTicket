spring.application.name=comment-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/comment_service}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:bondstone}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}
spring.kafka.consumer.group-id=comment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


server.port=${SERVER_PORT:8081}
