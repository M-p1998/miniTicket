apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ticket
  namespace: miniticket
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-ticket }
  template:
    metadata:
      labels: { app: postgres-ticket }
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom:
                {
                  secretKeyRef:
                    { name: miniticket-secrets, key: POSTGRES_USER },
                }
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: miniticket-secrets, key: POSTGRES_PASSWORD },
                }
            - name: POSTGRES_DB
              value: ticket_service
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ticket
  namespace: miniticket
spec:
  selector: { app: postgres-ticket }
  ports:
    - port: 5432
      targetPort: 5432
---
