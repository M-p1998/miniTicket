apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-service
  namespace: miniticket
spec:
  replicas: 1
  selector:
    matchLabels: { app: comment-service }
  template:
    metadata:
      labels: { app: comment-service }
    spec:
      containers:
        - name: comment-service
          image: miniticketacr12345.azurecr.io/miniticket/comment-service:latest
          ports: [{ containerPort: 8081 }]
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_URL
              value: jdbc:postgresql://postgres-comment:5432/comment_service
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: miniticket-secrets, key: POSTGRES_USER } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: miniticket-secrets, key: POSTGRES_PASSWORD } }
            - name: KC_ISSUER
              # value: http://keycloak:8080/realms/miniTicket
              value: https://auth.miniticket.online/realms/miniTicket
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: comment-service
  namespace: miniticket
spec:
  selector: { app: comment-service }
  ports:
    - port: 8081
      targetPort: 8081
