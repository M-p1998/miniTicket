apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: miniticket
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: miniticketacr12345.azurecr.io/miniticket/user-service:latest
          ports: [{ containerPort: 8083 }]
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_URL
              value: jdbc:postgresql://postgres-user:5432/user_service
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: miniticket-secrets, key: POSTGRES_USER } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: miniticket-secrets, key: POSTGRES_PASSWORD } }
            - name: KC_ISSUER
              # value: http://keycloak:8080/realms/miniTicket
              value: http://4.153.75.53:8080/realms/miniTicket
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: miniticket
spec:
  selector: { app: user-service }
  ports:
    - port: 8083
      targetPort: 8083
